<!DOCTYPE html>
<html>
<head>
    <title>数据导入</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h2>销售数据导入</h2>
        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}
        <form method="POST" enctype="multipart/form-data">
            <div class="mb-3">
                <label class="form-label">选择门店</label>
                <select class="form-select" name="store_id" required>
                    <option value="">请选择门店</option>
                    {% for store in stores %}
                    <option value="{{ store.id }}">{{ store.name }}（扣点比例：{{ store.deduction_rate*100 }}%）</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">选择Excel文件</label>
                <input type="file" class="form-control" name="file" accept=".xlsx,.xls" required>
                <div class="form-text">请确保文件包含以下列：商品条码、销售数量、销售单价、销售金额</div>
            </div>
            <button type="submit" class="btn btn-primary">提交导入</button>
            <a href="{{ url_for('export_data') }}" class="btn btn-secondary">转到导出页面</a>
        </form>
    </div>
</body>
</html>
